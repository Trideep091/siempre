<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220" fill="none">
  <defs>
    <filter id="photoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#332A27" flood-opacity="0.2" />
    </filter>
    <linearGradient id="photoSepia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6CE" />
      <stop offset="100%" stop-color="#D7BA91" />
    </linearGradient>
  </defs>

  <g filter="url(#photoShadow)">
    <!-- White paper border with slight vintage aging -->
    <rect x="10" y="10" width="260" height="200" rx="4" fill="#FAF6ED" stroke="#E6D7C3" stroke-width="2" />
    
    <!-- Photo Image Area -->
    <rect x="22" y="22" width="236" height="155" fill="url(#photoSepia)" />

    <!-- Garden Illustration in Sepia/Botanical Wash -->
    <!-- Distant hacienda stone wall -->
    <rect x="22" y="22" width="236" height="60" fill="#CBB28D" opacity="0.4" />
    <path d="M40 82 Q140 78 240 82" stroke="#8A6E4F" stroke-width="2" stroke-dasharray="8,4" />

    <!-- Blooming Cempasúchil Marigold Bushes -->
    <g transform="translate(30, 95)">
      <circle cx="30" cy="30" r="22" fill="#5A7753" opacity="0.6" />
      <circle cx="20" cy="18" r="8" fill="#F3A623" />
      <circle cx="38" cy="22" r="7" fill="#ED7047" />
      <circle cx="28" cy="35" r="9" fill="#F3A623" />
      <circle cx="12" cy="30" r="6" fill="#F9BA48" />
    </g>

    <g transform="translate(130, 90)">
      <circle cx="40" cy="35" r="28" fill="#476641" opacity="0.7" />
      <circle cx="30" cy="20" r="9" fill="#F3A623" />
      <circle cx="50" cy="25" r="10" fill="#ED7047" />
      <circle cx="25" cy="38" r="8" fill="#F9BA48" />
      <circle cx="48" cy="42" r="7.5" fill="#F3A623" />
      <circle cx="65" cy="32" r="6.5" fill="#F3A623" />
    </g>

    <!-- Figure of Young Elena watering flowers -->
    <g transform="translate(95, 75)">
      <circle cx="15" cy="10" r="7" fill="#6A4D3B" />
      <path d="M10 17 L20 17 L25 55 L5 55 Z" fill="#9C4452" opacity="0.85" />
      <!-- Watering can -->
      <path d="M25 32 L34 32 L38 25 L38 35 Z" fill="#6C7A89" />
      <!-- Water drops -->
      <path d="M38 35 L48 45 M38 37 L46 50" stroke="#7FB3D5" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>

    <!-- Handwritten Caption at Bottom of Photo -->
    <text x="140" y="196" font-family="'Caveat', cursive, Georgia, serif" font-size="15" fill="#5A473E" text-anchor="middle">
      Michoacán garden, autumn 1964
    </text>

    <!-- Photo Corner Mounting Triangles -->
    <polygon points="22,34 34,22 22,22" fill="#5A3E2B" opacity="0.6" />
    <polygon points="258,34 246,22 258,22" fill="#5A3E2B" opacity="0.6" />
    <polygon points="22,165 34,177 22,177" fill="#5A3E2B" opacity="0.6" />
    <polygon points="258,165 246,177 258,177" fill="#5A3E2B" opacity="0.6" />
  </g>
</svg>

