<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" fill="none">
  <defs>
    <filter id="portraitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#332A27" flood-opacity="0.25" />
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF5E4" />
      <stop offset="65%" stop-color="#EED9B7" />
      <stop offset="100%" stop-color="#CCA877" />
    </radialGradient>
  </defs>

  <!-- Ornate Carved Wooden Photo Frame -->
  <g filter="url(#portraitShadow)">
    <rect x="15" y="15" width="290" height="370" rx="12" fill="#5A3825" stroke="#3E2415" stroke-width="6" />
    <!-- Inner Gold Filigree Bevel -->
    <rect x="25" y="25" width="270" height="350" rx="8" fill="#F4D084" stroke="#B8860B" stroke-width="2" />
    <!-- White Matting / Mount -->
    <rect x="35" y="35" width="250" height="330" rx="4" fill="#FDFBF7" stroke="#E0D2BC" stroke-width="1.5" />
    
    <!-- Photo Inner Image Area -->
    <rect x="50" y="50" width="220" height="290" rx="2" fill="url(#vignette)" stroke="#B8A082" stroke-width="1" />

    <!-- Vintage Portrait Illustration: Abuela Elena -->
    <g transform="translate(160, 210)">
      <!-- Shoulders and Rebozo (Shawl) -->
      <path d="M-80 120 C-75 50 -45 20 -20 15 C0 15 20 15 45 20 C75 50 80 120 80 120 Z" fill="#6A4C3D" />
      <!-- Shawl texture folds -->
      <path d="M-60 120 Q-20 60 0 70 Q20 60 60 120" stroke="#8C6652" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M-25 120 L0 80 L25 120" fill="#9C4452" opacity="0.8" />

      <!-- Neck & Collar -->
      <rect x="-14" y="0" width="28" height="25" rx="4" fill="#DDB892" />
      
      <!-- Head / Face Silhouette in Warm Sepia -->
      <ellipse cx="0" cy="-25" rx="34" ry="42" fill="#E8C39E" />
      
      <!-- Classic Updo Hairstyle with Hair Comb -->
      <path d="M-36 -30 C-38 -75 0 -85 36 -30 C32 -55 10 -65 -15 -60 C-30 -55 -35 -40 -36 -30 Z" fill="#4A3B32" />
      <circle cx="0" cy="-65" r="14" fill="#4A3B32" /> <!-- Bun -->
      <!-- Golden hairpin / marigold hair flower -->
      <circle cx="16" cy="-60" r="7" fill="#F3A623" />
      <circle cx="16" cy="-60" r="3.5" fill="#ED7047" />

      <!-- Warm Facial Features: Kind Eyes, Gentle Smile, Laugh Lines -->
      <path d="M-18 -26 Q-12 -30 -6 -26" stroke="#5A3E2B" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M6 -26 Q12 -30 18 -26" stroke="#5A3E2B" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Soft cheek blush -->
      <circle cx="-16" cy="-14" r="6" fill="#DC6073" opacity="0.25" />
      <circle cx="16" cy="-14" r="6" fill="#DC6073" opacity="0.25" />
      <!-- Nose bridge -->
      <path d="M-1 -26 L1 -14 Q-1 -10 -4 -12" stroke="#B88A68" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <!-- Gentle smiling lips -->
      <path d="M-12 -3 Q0 6 12 -3" stroke="#9C4452" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <!-- Laugh lines -->
      <path d="M-22 -24 Q-24 -14 -18 -8" stroke="#C29A78" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M22 -24 Q24 -14 18 -8" stroke="#C29A78" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Subtle deckled photo corner accents (vintage photo mounting tabs) -->
    <polygon points="50,65 65,50 50,50" fill="#3E2415" opacity="0.7" />
    <polygon points="270,65 255,50 270,50" fill="#3E2415" opacity="0.7" />
    <polygon points="50,325 65,340 50,340" fill="#3E2415" opacity="0.7" />
    <polygon points="270,325 255,340 270,340" fill="#3E2415" opacity="0.7" />

    <!-- Name Label Ribbon at bottom -->
    <g transform="translate(70, 318)">
      <rect x="0" y="0" width="180" height="26" rx="4" fill="#FFF3D8" stroke="#D8C29D" stroke-width="1" />
      <text x="90" y="17" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#332A27" text-anchor="middle" font-weight="600">
        Elena Rosales (1938–2021)
      </text>
    </g>
  </g>
</svg>

